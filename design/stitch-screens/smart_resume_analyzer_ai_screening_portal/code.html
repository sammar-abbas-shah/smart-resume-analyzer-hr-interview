<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-tint": "#0053db", "on-tertiary-fixed": "#002114", "primary-container": "#2563eb", "surface-container": "#eceef0", "surface-variant": "#e0e3e5", "on-primary-container": "#eeefff", "surface": "#f7f9fb", "secondary-fixed": "#dae2fd", "tertiary-fixed": "#85f8c4", "primary-fixed": "#dbe1ff", "tertiary-container": "#007d57", "surface-container-highest": "#e0e3e5", "surface-bright": "#f7f9fb", "on-secondary": "#ffffff", "on-secondary-fixed": "#131b2e", "on-tertiary-container": "#bdffdc", "on-error": "#ffffff", "surface-dim": "#d8dadc", "surface-container-high": "#e6e8ea", "on-background": "#191c1e", "on-error-container": "#93000a", "on-tertiary-fixed-variant": "#005137", "on-tertiary": "#ffffff", "surface-container-low": "#f2f4f6", "tertiary": "#006243", "on-primary": "#ffffff", "on-surface": "#191c1e", "secondary-fixed-dim": "#bec6e0", "outline": "#737686", "tertiary-fixed-dim": "#68dba9", "outline-variant": "#c3c6d7", "on-secondary-container": "#5c647a", "primary": "#004ac6", "surface-container-lowest": "#ffffff", "inverse-surface": "#2d3133", "on-primary-fixed": "#00174b", "inverse-on-surface": "#eff1f3", "on-surface-variant": "#434655", "error-container": "#ffdad6", "primary-fixed-dim": "#b4c5ff", "error": "#ba1a1a", "secondary-container": "#dae2fd", "secondary": "#565e74", "on-secondary-fixed-variant": "#3f465c", "on-primary-fixed-variant": "#003ea8", "inv ce/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container active:bg-surface-container-high transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[20px]">chevron_left</span></button><img alt="PakTalent AI Logo" class="h-8 w-auto object-contain hidden sm:block" src="https://lh3.googleusercontent.com/aida/AEtjO1WdaCvcUwdeNf9-7XHSN4Hwo79Q1mToAUf6rvDalHwtiQ0TG0o8We9oykitcbvLuE7Q03aXQCNJSurCcaN-JMUqYTjhvNX0oejrNthJ0GOKEH5Xm5wAXCmrnePK3ZxH2Ki3PMdvDdjOEVW8XGjIyTZOLgsx3RNqk1f40jPvwLhrQX1hzT0kfVsCnmvkpQdK4JZ9BiWgV_HCAjVJLxUEtu4arJ-Lx-FK6IoZHc1EF9xvUHpcm2D0rky6_Fs"></div><div class="flex items-center gap-space-xs"><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Sign In</h1><span class="inline-flex items-center justify-center ml-1"><span class="w-2 h-2 rounded-full bg-tertiary" title="AI Engine Ready"></span></span></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 bg-surface pb-safe pb-16"><div class="flex flex-col w-full">
<div class="w-full max-w-md mx-auto px-gutter py-space-md flex flex-col justify-center">
<!-- Top Identity Tile -->
<div class="flex flex-col items-center text-center mt-2 mb-space-lg">
<div class="w-16 h-16 rounded-xl bg-surface-container-lowest p-2 shadow-sm flex items-center justify-center relative mb-space-md">
<img alt="Smart Resume Analyzer Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1WBsK0jtLZaOx_W3vIkhTW_3go40CmcmueBH13ttURLiccR2Kg99oKbpPqFr8F3M0sgmfJVhvEVTxST9n80Ta_CZ7gu7XR5t-KYE2JfMuWZiUsHDeGEwQjfOkD-FippOOU0d-pfqG2Y7kr_XDSmWr-4OeucdFqcu9s6ZaIiac1-cvYDbEYHXlXg0JfPDU6dfj32g93RWQX88z-Fe8Xt14_WmzuXPSVd6RYSncrGsj6gVNOsHs3jnizf9pk">
<span class="absolute -top-1 -right-1 flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary-fixed-dim opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-tertiary"></span>
</span>
</div>
<div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed mb-space-xs">
<span class="material-symbols-outlined text-[14px]">auto_awesome</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Smart Resume &amp; HR Interview</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-background tracking-tight">Smart Resume Analyzer</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[300px] mt-1">
        Sign in to view your resume ATS score and AI interview status.
      </p>
</div>
<!-- Segmented Tab Switch -->
<div class="w-full bg-surface-container-high p-1 rounded-full flex items-center mb-space-lg">
<button class="flex-1 py-2 rounded-full font-label-lg text-label-lg transition-all duration-200 bg-surface-container-lowest text-on-surface shadow-sm text-center" id="tab-signin" onclick="setAuthMode('signin')" type="button">
        Sign In
      </button>
<button class="flex-1 py-2 rounded-full font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant text-center" id="tab-signup" onclick="setAuthMode('signup')" type="button">
        Sign Up
      </button>
</div>
<!-- Interactive Auth Form -->
<form class="flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault(); triggerAuth();">
<!-- Name Field (Revealed in Sign Up Mode) -->
<div class="hidden flex-col gap-1.5 transition-all duration-200" id="field-fullname">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider pl-1" for="fullname">
          Full Name
        </label>
<div class="bg-surface-container-lowest rounded-xl px-4 py-3 shadow-sm flex items-center gap-3 focus-within:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-outline text-[20px]">badge</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="fullname" placeholder="Muhammad Hamza" type="text">
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider pl-1" for="email">
          Email Address
        </label>
<div class="bg-surface-container-lowest rounded-xl px-4 py-3 shadow-sm flex items-center gap-3 focus-within:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="email" placeholder="name@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider pl-1" for="password">
          Password
        </label>
<div class="bg-surface-container-lowest rounded-xl px-4 py-3 shadow-sm flex items-center gap-3 focus-within:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password view" class="w-8 h-8 rounded-full flex items-center justify-center text-outline hover:text-on-surface transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between py-1 px-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="sr-only peer" id="remember-me" type="checkbox">
<div class="w-5 h-5 rounded bg-surface-container flex items-center justify-center peer-checked:bg-primary-container text-transparent peer-checked:text-on-primary transition-all">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#forgot" onclick="showToast('Password reset link sent to your registered email')">
          Forgot password?
        </a>
</div>
<!-- Primary Decision Button -->
<button class="w-full min-h-[48px] py-3.5 px-6 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg shadow-md hover:bg-primary transition-all active:scale-[0.99] flex items-center justify-center gap-2 mt-1" id="btn-submit" type="submit">
<span id="btn-label" class="">Sign In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Soft Decorative Divider -->
<div class="relative flex items-center justify-center my-space-sm">
<div class="w-full h-px bg-surface-variant"></div>
<span class="absolute px-3 bg-surface text-outline font-label-sm text-label-sm uppercase tracking-wider">
          Or Continue As
        </span>
</div>
<!-- Role Switcher Alternative Button -->
<button class="w-full min-h-[48px] py-3 px-5 rounded-xl bg-surface-container-lowest text-on-surface font-label-lg text-label-lg shadow-sm hover:bg-surface-container transition-colors flex items-center justify-center gap-2.5" onclick="showToast('Switching to Recruiter Portal...')" type="button">
<span class="w-6 h-6 rounded-full bg-secondary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-secondary-fixed">corporate_fare</span>
</span>
<span class="">Sign in as Recruiter / HR</span>
</button>
</form>
<!-- Bottom Navigation Footer -->
<div class="text-center mt-space-lg py-2">
<p class="font-body-md text-body-md text-on-surface-variant">
<span id="footer-helper-text" class="">Don't have an account?</span>
<button class="font-label-lg text-label-lg text-primary ml-1 hover:underline" id="footer-action-link" onclick="toggleAuthMode()" type="button">
          Sign Up
        </button>
</p>
</div>
<!-- Live Resume Readiness Micro-Indicator -->

</div>
<!-- Toast Notification Module -->
<div class="fixed bottom-safe mb-4 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-4 py-2.5 rounded-full font-label-md text-label-md shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2" id="toast">
<span class="material-symbols-outlined text-[18px] text-tertiary-fixed">info</span>
<span id="toast-message" class="">Notification</span>
</div>
</div>
<script>
  let currentAuthMode = 'signin';

  function setAuthMode(mode) {
    currentAuthMode = mode;
    const tabSignIn = document.getElementById('tab-signin');
    const tabSignUp = document.getElementById('tab-signup');
    const fieldFullName = document.getElementById('field-fullname');
    const btnLabel = document.getElementById('btn-label');
    const footerHelper = document.getElementById('footer-helper-text');
    const footerAction = document.getElementById('footer-action-link');

    if (mode === 'signup') {
      tabSignIn.className = 'flex-1 py-2 rounded-full font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant text-center';
      tabSignUp.className = 'flex-1 py-2 rounded-full font-label-lg text-label-lg transition-all duration-200 bg-surface-container-lowest text-on-surface shadow-sm text-center';
      fieldFullName.classList.remove('hidden');
      fieldFullName.classList.add('flex');
      btnLabel.innerText = 'Create Account';
      footerHelper.innerText = 'Already have an account?';
      footerAction.innerText = 'Sign In';
    } else {
      tabSignUp.className = 'flex-1 py-2 rounded-full font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant text-center';
      tabSignIn.className = 'flex-1 py-2 rounded-full font-label-lg text-label-lg transition-all duration-200 bg-surface-container-lowest text-on-surface shadow-sm text-center';
      fieldFullName.classList.add('hidden');
      fieldFullName.classList.remove('flex');
      btnLabel.innerText = 'Sign In';
      footerHelper.innerText = "Don't have an account?";
      footerAction.innerText = 'Sign Up';
    }
  }

  function toggleAuthMode() {
    setAuthMode(currentAuthMode === 'signin' ? 'signup' : 'signin');
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.innerText = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      eyeIcon.innerText = 'visibility';
    }
  }

  function triggerAuth() {
    const emailVal = document.getElementById('email').value;
    const actionName = currentAuthMode === 'signin' ? 'Signing in' : 'Registering candidate';
    showToast(actionName + ' as ' + (emailVal || 'Guest') + '...');
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    const msgSpan = document.getElementById('toast-message');
    msgSpan.innerText = message;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    toast.classList.add('opacity-100');
    setTimeout(() => {
      toast.classList.add('opacity-0', 'pointer-events-none');
      toast.classList.remove('opacity-100');
    }, 2800);
  }
</script></main>



</body></html>
