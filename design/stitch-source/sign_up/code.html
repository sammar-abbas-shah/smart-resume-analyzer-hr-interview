rface-variant": "#e5e2e1", "surface-dim": "#dcd9d9" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.75rem", "gutter": "1rem", "space-xs": "0.5rem", "space-xl": "3rem", "space-md": "1.25rem", "space-lg": "2rem", "margin": "1.5rem" }, "fontFamily": { "body-md": ["Inter"], "label-lg": ["Inter"], "label-sm": ["Inter"], "headline-md": ["Inter"], "headline-lg": ["Inter"], "body-lg": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-lg": ["15px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "500" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "headline-lg": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "600" }] } } } };</script><style>

  </head><body class="bg-surface-container-lowest font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen pb-safe"><main class="w-full max-w-[390px] min-h-[844px] mx-auto flex flex-col bg-white relative"><div class="flex flex-col w-full h-[844px] justify-between">
<!-- Top Header Bar -->
<header class="w-full bg-primary-container h-16 pt-safe flex items-center justify-between px-margin rounded-b-[16px] select-none shrink-0">
<button aria-label="Go back" class="flex items-center justify-center w-8 h-8 text-on-primary active:opacity-75 transition-opacity" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-primary font-semibold tracking-tight text-center">
      Create Account
    </h1>
<div aria-hidden="true" class="w-8 h-8"></div>
</header>
<!-- Centered Interactive Content Group -->
<main class="w-full flex-1 flex flex-col justify-center px-margin max-w-[390px] mx-auto">
<div class="flex flex-col space-y-4 w-full">
<!-- Heading -->
<div class="text-center pb-1">
<h2 class="font-headline-md text-headline-md font-bold text-on-surface tracking-tight">
          Sign Up
        </h2>
</div>
<!-- Segmented Role Selector -->
<div aria-label="Account Type" class="flex items-center w-full p-1 bg-surface-container rounded-lg select-none" role="tablist">
<button aria-selected="true" class="flex-1 h-[42px] flex items-center justify-center rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg font-bold transition-all" id="btn-job-seeker" onclick="selectRole('job-seeker')" role="tab" type="button">
          Job Seeker
        </button>
<button aria-selected="false" class="flex-1 h-[42px] flex items-center justify-center rounded-lg bg-transparent text-on-surface-variant font-label-lg text-label-lg font-bold transition-all" id="btn-recruiter" onclick="selectRole('recruiter')" role="tab" type="button">
          Recruiter
        </button>
</div>
<!-- Form Inputs -->
<form class="flex flex-col space-y-4 w-full" onsubmit="event.preventDefault();">
<div class="w-full">
<input autocomplete="name" class="w-full h-[52px] px-4 bg-surface-container-lowest font-body-lg text-body-lg text-on-surface placeholder:text-outline placeholder:font-normal rounded-lg border border-outline-variant focus:outline-none focus:border-primary-container transition-colors" placeholder="Full Name" type="text">
</div>
<div class="w-full">
<input autocomplete="email" class="w-full h-[52px] px-4 bg-surface-container-lowest font-body-lg text-body-lg text-on-surface placeholder:text-outline placeholder:font-normal rounded-lg border border-outline-variant focus:outline-none focus:border-primary-container transition-colors" placeholder="Email" type="email">
</div>
<div class="w-full">
<input autocomplete="new-password" class="w-full h-[52px] px-4 bg-surface-container-lowest font-body-lg text-body-lg text-on-surface placeholder:text-outline placeholder:font-normal rounded-lg border border-outline-variant focus:outline-none focus:border-primary-container transition-colors" placeholder="Password" type="password">
</div>
<!-- Primary Action Button -->
<button class="w-full h-[52px] bg-primary-container hover:bg-on-primary-fixed-variant active:bg-[#329C75] text-on-primary font-label-lg text-label-lg font-bold rounded-lg flex items-center justify-center transition-colors" type="submit">
          Create Account
        </button>
</form>
<!-- Sub-Action Direct Link -->
<div class="text-center pt-2">
<p class="font-body-md text-body-md text-on-surface">
          Already have an account? 
          <button class="font-label-lg text-label-lg font-bold text-primary-container hover:underline ml-1 inline-flex" type="button">
            Sign In
          </button>
</p>
</div>
</div>
</main>
<!-- Clean Bottom Margin Buffer -->
<div aria-hidden="true" class="w-full h-8 pb-safe shrink-0"></div>
</div>
<script>
  function selectRole(role) {
    const jobSeekerBtn = document.getElementById('btn-job-seeker');
    const recruiterBtn = document.getElementById('btn-recruiter');

    if (role === 'job-seeker') {
      jobSeekerBtn.className = 'flex-1 h-[42px] flex items-center justify-center rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg font-bold transition-all';
      jobSeekerBtn.setAttribute('aria-selected', 'true');

      recruiterBtn.className = 'flex-1 h-[42px] flex items-center justify-center rounded-lg bg-transparent text-on-surface-variant font-label-lg text-label-lg font-bold transition-all';
      recruiterBtn.setAttribute('aria-selected', 'false');
    } else {
      recruiterBtn.className = 'flex-1 h-[42px] flex items-center justify-center rounded-lg bg-primary-container text-on-primary font-label-lg text-label-lg font-bold transition-all';
      recruiterBtn.setAttribute('aria-selected', 'true');

      jobSeekerBtn.className = 'flex-1 h-[42px] flex items-center justify-center rounded-lg bg-transparent text-on-surface-variant font-label-lg text-label-lg font-bold transition-all';
      jobSeekerBtn.setAttribute('aria-selected', 'false');
    }
  }
</script></main>
</body></html>
