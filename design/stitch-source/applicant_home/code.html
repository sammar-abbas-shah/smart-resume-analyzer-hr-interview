ertiary-fixed': '#ffdad7', 'surface': '#fcf9f8', 'on-secondary': '#ffffff' }, borderRadius: { 'DEFAULT': '0.25rem', 'lg': '0.5rem', 'xl': '0.75rem', 'full': '9999px' }, spacing: { 'space-xs': '0.5rem', 'space-lg': '2rem', 'margin': '1.5rem', 'space-xl': '3rem', 'space-sm': '0.75rem', 'gutter': '1rem', 'space-md': '1.25rem' }, fontFamily: { 'headline-sm': ['Inter'], 'label-lg': ['Inter'], 'label-md': ['Inter'], 'body-md': ['Inter'], 'headline-md': ['Inter'], 'label-sm': ['Inter'], 'body-lg': ['Inter'], 'headline-lg': ['Inter'] }, fontSize: { 'headline-sm': ['18px', { lineHeight: '24px', letterSpacing: '-0.01em', fontWeight: '600' }], 'label-lg': ['15px', { lineHeight: '20px', letterSpacing: '0.01em', fontWeight: '700' }], 'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.03em', fontWeight: '600' }], 'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }], 'headline-md': ['22px', { lineHeight: '28px', letterSpacing: '-0.015em', fontWeight: '600' }], 'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.02em', fontWeight: '500' }], 'body-lg': ['16px', { lineHeight: '24px', fontWeight: '400' }], 'headline-lg': ['30px', { lineHeight: '36px', letterSpacing: '-0.02em', fontWeight: '700' }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 pt-safe bg-primary-container rounded-b-2xl"><div class="h-16 px-margin flex items-center justify-between"><h1 class="text-headline-sm font-headline-sm text-on-primary truncate max-w-[240px]">Applicant Home</h1></div></header><main class="flex-1 flex flex-col justify-between relative w-full px-6 pt-20 pb-24 bg-surface"><div class="flex flex-col w-full">
<!-- Minimal User Badge / Pill -->

<!-- Primary Welcome Title -->
<div class="mb-space-lg text-left">
<h2 class="font-headline-lg text-headline-lg text-on-surface font-bold tracking-tight">Welcome, Hamza</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">
      Application Overview
    </p>
</div>
<!-- Utilitarian Content List -->
<div class="flex flex-col gap-4 mb-6">
<!-- Row 1: Resume -->
<div class="flex items-center justify-between py-space-md bg-surface-container-low px-gutter rounded-lg mb-space-xs">
<span class="font-body-lg text-body-lg text-on-surface-variant font-medium">My Resume</span>
<span class="font-label-lg text-label-lg text-on-surface font-semibold flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary text-[20px]">description</span>
        my_resume.pdf
      </span>
</div>
<!-- Row 2: Match Score -->
<div class="flex items-center justify-between py-space-md bg-surface-container-low px-gutter rounded-lg mb-space-xs">
<span class="font-body-lg text-body-lg text-on-surface-variant font-medium">Match Score</span>
<span class="font-headline-md text-headline-md text-primary font-bold">85%</span>
</div>
<!-- Row 3: Interview Status -->
<div class="flex items-center justify-between py-space-md bg-surface-container-low px-gutter rounded-lg">
<span class="font-body-lg text-body-lg text-on-surface-variant font-medium">Interview Status</span>
<span class="font-label-lg px-2.5 py-1 rounded bg-secondary-fixed text-on-secondary-fixed font-bold uppercase tracking-wider text-[14px]">
        Pending
      </span>
</div>
</div>
<!-- Primary Action Button -->
<div class="w-full">
<button class="w-full h-[52px] bg-primary-container hover:bg-primary active:bg-secondary text-on-primary font-label-lg text-label-lg rounded-lg flex items-center justify-center gap-space-xs transition-colors cursor-pointer select-none" id="startInterviewBtn" type="button">
<span class="">Start Interview</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Tactile Micro-interaction Script -->
<script>
    (function() {
      const btn = document.getElementById('startInterviewBtn');
      if (!btn) return;
      btn.addEventListener('click', function() {
        const textSpan = this.querySelector('span:first-child');
        const iconSpan = this.querySelector('.material-symbols-outlined');
        if (textSpan && iconSpan) {
          textSpan.textContent = 'Connecting...';
          iconSpan.textContent = 'sync';
          iconSpan.classList.add('animate-spin');
          setTimeout(() => {
            textSpan.textContent = 'Ready!';
            iconSpan.textContent = 'check';
            iconSpan.classList.remove('animate-spin');
          }, 1200);
        }
      });
    })();
  </script>
