<script>
  // Simple interactive timer & mic state toggle micro-interactions
  (function() {
    let secondsLeft = 90;
    const timerElem = document.getElementById('timer-display');
    const timerInterval = setInterval(() => {
      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        return;
      }
      secondsLeft--;
      const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
      const secs = String(secondsLeft % 60).padStart(2, '0');
      if (timerElem) {
        timerElem.textContent = `Time remaining: ${mins}:${secs}`;
      }
    }, 1000);

    const micBtn = document.getElementById('mic-record-btn');
    const micLabel = document.getElementById('mic-btn-label');
    const micIcon = document.getElementById('mic-icon');
    const wordCountBadge = document.getElementById('word-count-badge');
    const textarea = document.getElementById('interview-answer');
    let isRecording = false;

    if (micBtn && textarea) {
      micBtn.addEventListener('click', () => {
        isRecording = !isRecording;
        if (isRecording) {
          micBtn.classList.replace('bg-surface-container', 'bg-error-container');
          micBtn.classList.replace('text-on-surface', 'text-on-error-container');
          micLabel.textContent = 'Listening...';
          micIcon.textContent = 'graphic_eq';
          wordCountBadge.textContent = 'Recording live...';
          
          if (!textarea.value) {
            textarea.value = "In my last role, I developed a scalable task management dashboard using React with Zustand for atomic state updates and React Query for asynchronous server-cache synchronization...";
          }
        } else {
          micBtn.classList.replace('bg-error-container', 'bg-surface-container');
          micBtn.classList.replace('text-on-error-container', 'text-on-surface');
          micLabel.textContent = 'Record Voice';
          micIcon.textContent = 'mic';
          const words = textarea.value.trim() ? textarea.value.trim().split(/\s+/).length : 0;
          wordCountBadge.textContent = `${words} words captured`;
        }
      });

      textarea.addEventListener('input', () => {
        const words = textarea.value.trim() ? textarea.value.trim().split(/\s+/).length : 0;
        wordCountBadge.textContent = `${words} words captured`;
      });
    }
  })();
</script></main><footer class="w-full py-space-md pb-safe px-margin flex items-center justify-center"><p class="text-label-sm font-label-sm text-secondary text-center">© 2026 Smart Resume Analyzer • AI Applicant Portal</p></footer>
